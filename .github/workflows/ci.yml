name: Cross-Platform CI & Release Packaging

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Frontend checks (fast, runs on Linux for speed) ────────────────────────
  frontend:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build

  # ── Rust checks ─────────────────────────────────────────────────────────────
  rust-windows:
    name: Rust — Windows x64 (fmt + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-macos:
    name: Rust — macOS ARM64 (fmt + clippy + test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── Tauri bundle — Windows ──────────────────────────────────────────────────
  tauri-windows:
    name: Tauri Bundle — Windows x64
    runs-on: windows-latest
    needs: [frontend, rust-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Build Tauri Windows Bundle
        run: npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Verify Windows Artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe","src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if (-not $artifacts) {
            $fallbackExe = Get-Item "src-tauri/target/release/youtube-isolation-manager.exe" -ErrorAction SilentlyContinue
            if (-not $fallbackExe) {
              Write-Error "Windows build artifact not found!"
              exit 1
            }
            Write-Host "Found binary: $($fallbackExe.FullName)"
          } else {
            $artifacts | ForEach-Object { Write-Host "Verified: $($_.FullName)" }
          }

  # ── Tauri bundle — macOS ARM64 ──────────────────────────────────────────────
  tauri-macos:
    name: Tauri Bundle — macOS ARM64
    runs-on: macos-14
    needs: [frontend, rust-macos]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Build Tauri macOS Bundle
        run: npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
        continue-on-error: false
      - name: Verify macOS Artifacts
        shell: bash
        run: |
          if ls src-tauri/target/release/bundle/macos/*.app 2>/dev/null || ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null; then
            echo "macOS bundle artifacts verified"
            ls -la src-tauri/target/release/bundle/ || true
          elif [ -f "src-tauri/target/release/youtube-isolation-manager" ]; then
            echo "Verified binary: src-tauri/target/release/youtube-isolation-manager"
          else
            echo "ERROR: macOS build artifact not found"
            exit 1
          fi
