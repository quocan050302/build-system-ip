name: Cross-Platform CI & Release Packaging

on:
  push:
    branches: [main, master, 'fix/**', 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Frontend checks (fast, runs on Linux for speed) ────────────────────────
  frontend:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  # ── Rust checks ─────────────────────────────────────────────────────────────
  rust-windows:
    name: Rust — Windows x64 (fmt + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run Bounded V9 Verification Suite (fmt + clippy + unit + integration + replay)
        shell: pwsh
        run: |
          $artifactDir = "$env:RUNNER_TEMP/anti-v9/$env:GITHUB_SHA/$env:GITHUB_RUN_ID-windows"
          python scripts/verify_v9.py --skip-frontend --artifact-dir "$artifactDir"
          if (-not (Test-Path "$artifactDir/v9_run_manifest.json")) {
            Write-Error "Missing durable v9_run_manifest.json!"
            exit 1
          }
      - name: Upload V9 Evidence Bundle (Windows x64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-v9-evidence-windows-x64
          path: ${{ runner.temp }}/anti-v9
          retention-days: 14

  rust-macos:
    name: Rust — macOS ARM64 (fmt + clippy + test)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify ARM64 runner architecture
        run: |
          uname -s
          uname -m
          rustc -vV || true
          echo "Expected: aarch64, arm64, or Darwin arm64"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run Bounded V9 Verification Suite (Real Edge + Local Proxy + Replay)
        run: |
          ARTIFACT_DIR="${RUNNER_TEMP}/anti-v9/${GITHUB_SHA}/${GITHUB_RUN_ID}-macos"
          if [ -x "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" ]; then
            echo "Microsoft Edge detected on macos-15 runner — enforcing ANTI_REQUIRE_REAL_EDGE=1"
            python3 scripts/verify_v9.py --skip-frontend --require-real-edge --artifact-dir "${ARTIFACT_DIR}"
          else
            echo "Microsoft Edge binary not present on runner — running with explicit NOT_RUN recording"
            python3 scripts/verify_v9.py --skip-frontend --artifact-dir "${ARTIFACT_DIR}"
          fi
          test -f "${ARTIFACT_DIR}/v9_run_manifest.json"
          test -f "${ARTIFACT_DIR}/v9_summary.md"
      - name: Upload V9 Evidence Bundle (macOS ARM64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-v9-evidence-macos-arm64
          path: ${{ runner.temp }}/anti-v9
          retention-days: 14

  # ── Tauri bundle — Windows ──────────────────────────────────────────────────
  tauri-windows:
    name: Tauri Bundle — Windows x64
    runs-on: windows-latest
    needs: [frontend, rust-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache Tauri Windows Bundler Tools (NSIS)
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-tools-windows-v1
      - run: npm ci
      - run: npm run build
      - name: Build Tauri Windows NSIS Installer (Bounded Retry on Transient Download 5xx)
        shell: pwsh
        run: |
          $maxAttempts = 3
          $attempt = 1
          $bundlerExit = 1
          while ($attempt -le $maxAttempts) {
            Write-Host "Tauri Windows NSIS build attempt $attempt of $maxAttempts..."
            npx @tauri-apps/cli build --bundles nsis
            $bundlerExit = $LASTEXITCODE
            $nsisInstallers = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 0 })
            if (($bundlerExit -eq 0) -and ($nsisInstallers.Count -gt 0)) {
              break
            }
            if ($attempt -lt $maxAttempts) {
              $sleepSec = 5 * $attempt
              Write-Warning "Attempt $attempt returned exit code $bundlerExit (NSIS installer count: $($nsisInstallers.Count)). Retrying in ${sleepSec}s..."
              Start-Sleep -Seconds $sleepSec
            }
            $attempt++
          }
          $artifactDir = "$env:RUNNER_TEMP/anti-v9/$env:GITHUB_SHA/$env:GITHUB_RUN_ID-tauri-windows"
          pwsh -NoProfile -File scripts/verify_windows_package.ps1 -BundlerExitCode $bundlerExit -ArtifactDir "$artifactDir"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
      - name: Upload Windows Packaging Evidence Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-v9-packaging-windows-x64
          path: ${{ runner.temp }}/anti-v9
          retention-days: 14

  # ── Tauri bundle — macOS ARM64 ──────────────────────────────────────────────
  tauri-macos:
    name: Tauri Bundle — macOS ARM64
    runs-on: macos-15
    needs: [frontend, rust-macos]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify ARM64 runner architecture
        run: |
          uname -s
          uname -m
          rustc -vV || true
          echo "Expected: aarch64, arm64, or Darwin arm64"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Build Tauri macOS Bundle
        run: npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
        continue-on-error: false
      - name: Verify macOS Artifacts
        shell: bash
        run: |
          if ls src-tauri/target/release/bundle/macos/*.app 2>/dev/null || ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null; then
            echo "macOS bundle artifacts verified"
            ls -la src-tauri/target/release/bundle/ || true
          elif [ -f "src-tauri/target/release/youtube-isolation-manager" ]; then
            echo "Verified binary: src-tauri/target/release/youtube-isolation-manager"
          else
            echo "ERROR: macOS build artifact not found"
            exit 1
          fi
