name: Cross-Platform CI & Release Packaging

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Build & Test on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Build Frontend Assets
        run: npm run build

      - name: Run Rust Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Application Bundle
        run: npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Verify Windows Artifacts Exist
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe", "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if (-not $artifacts) {
            $fallbackExe = Get-Item "src-tauri/target/release/youtube-isolation-manager.exe" -ErrorAction SilentlyContinue
            if (-not $fallbackExe) {
              Write-Error "Windows build artifact (.exe / .msi) was not generated in target directory!"
              exit 1
            }
            Write-Host "Found binary: $($fallbackExe.FullName)"
          } else {
            $artifacts | ForEach-Object { Write-Host "Verified Artifact: $($_.FullName)" }
          }

      - name: Verify macOS Artifacts Exist
        if: matrix.platform == 'macos-aarch64'
        shell: bash
        run: |
          if [ -d "src-tauri/target/release/bundle/macos/YouTube Isolation Manager.app" ] || [ -f "src-tauri/target/release/bundle/dmg/"*.dmg ]; then
            echo "Verified macOS App / DMG artifacts exist in bundle directory:"
            ls -la src-tauri/target/release/bundle/macos/ || true
            ls -la src-tauri/target/release/bundle/dmg/ || true
          elif [ -f "src-tauri/target/release/youtube-isolation-manager" ]; then
            echo "Verified release binary: src-tauri/target/release/youtube-isolation-manager"
          else
            echo "macOS build artifact was not generated in release target directory!"
            exit 1
          fi
